[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nft-sniper"
version = "0.1.0"
description = "Telegram-бот: поиск недооценённых NFT на TON. Находит, оценивает, объясняет — решение за человеком."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "NFT Sniper Team" }]
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "greenlet>=3,<4",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=5.0,<7",
    "SQLAlchemy[asyncio]>=2.0.30,<3",
    "structlog>=24.1,<26",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]

[project.scripts]
nftsniper = "nftsniper.entrypoints.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nftsniper"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "PT",  # pytest style
    "RET", # return style
    "ASYNC",
    "PL",  # pylint
    "TID", # tidy imports
]
ignore = [
    "RUF001",  # кириллица в докстрингах/комментариях
    "RUF002",
    "RUF003",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # магические числа в ассертах — нормально

[tool.ruff.lint.isort]
known-first-party = ["nftsniper"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
