<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFT Sniper</title>
<style>
  :root {
    --bg: #0d1220; --panel: #161d30; --panel2: #1d2742; --border: #26304d;
    --text: #e9edf7; --muted: #93a0bd; --accent: #526eff; --accent2: #0098ea;
    --ok: #3ddc84; --warn: #ffb020; --danger: #ff5c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    padding-bottom: 40px;
  }
  #app { max-width: 460px; margin: 0 auto; }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: rgba(13,18,32,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 17px; letter-spacing: .3px; flex: 1; }
  .logo b { color: var(--accent2); }
  .demo-badge {
    background: var(--warn); color: #201500; font-weight: 700; font-size: 11px;
    padding: 2px 8px; border-radius: 20px; letter-spacing: .5px;
  }
  .hidden { display: none !important; }
  .icon-btn {
    background: none; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 4px 8px;
  }
  main { padding: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12.5px;
    font-weight: 600; background: var(--panel2); border: 1px solid var(--border); margin: 0 6px 6px 0;
  }
  .badge.deal { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; }
  .cta {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin: 8px 0;
    text-align: center; text-decoration: none;
  }
  .cta:active { opacity: .85; }
  .ghost {
    display: block; width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 14px;
    background: none; color: var(--muted); font-size: 14.5px; cursor: pointer; margin: 4px 0;
    text-align: center; text-decoration: none;
  }
  /* список */
  .item-card { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .item-card:active { background: var(--panel2); }
  .thumb {
    width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, #2a3560, #12324a); display: flex;
    align-items: center; justify-content: center; font-weight: 800; color: #9db8ff; font-size: 15px;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-name { font-weight: 700; }
  .item-price { color: var(--accent2); font-weight: 700; }
  /* деталка */
  .nft-img-wrap { position: relative; margin-bottom: 14px; }
  .nft-img-wrap img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 18px;
    border: 1px solid var(--border); background: var(--panel);
  }
  .nft-img-fallback {
    display: none; position: absolute; inset: 0; border-radius: 18px;
    background: linear-gradient(135deg, #22305c, #0f3a52 60%, #1c2547);
    align-items: center; justify-content: center; border: 1px solid var(--border);
  }
  .nft-img-fallback span { font-size: 44px; font-weight: 800; color: #9db8ff; opacity: .8; }
  .nft-title { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
  .nft-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
  .price-main { font-size: 26px; margin-bottom: 12px; }
  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .price-grid > div { background: var(--panel2); border-radius: 10px; padding: 9px 11px; }
  .price-grid span { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .price-grid b { font-size: 14.5px; }
  .conf-bar {
    height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin: 4px 2px 10px;
  }
  .conf-bar div { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .explain { font-size: 13px; color: var(--muted); margin: 3px 2px; }
  .traits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .trait {
    background: var(--panel2); border-radius: 10px; padding: 9px 11px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .trait span { font-size: 11.5px; color: var(--muted); }
  .trait b { font-size: 14px; }
  .trait em { font-style: normal; font-size: 11.5px; color: var(--accent2); }
  .risk {
    background: rgba(255,176,32,.08); border: 1px solid rgba(255,176,32,.35);
    border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px;
  }
  .addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; color: var(--accent2); }
  .hist { margin-bottom: 14px; }
  .p2p-note {
    font-size: 12.5px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-top: 6px;
  }
  /* оплата */
  .addr-input {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px; font-size: 14px; font-family: ui-monospace, Menlo, monospace;
    margin-bottom: 10px; outline: none;
  }
  .addr-input:focus { border-color: var(--accent); }
  .demo-note { color: var(--warn); font-size: 12.5px; margin-top: 8px; }
  .qr-card { text-align: center; }
  .qr-wrap { position: relative; display: inline-block; margin: 6px 0 12px; }
  .qr-wrap img {
    width: 220px; height: 220px; border-radius: 14px; background: #fff; padding: 8px;
  }
  .qr-watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: rgba(255,80,80,.55);
    transform: rotate(-18deg); pointer-events: none; letter-spacing: 4px;
  }
  .pay-row {
    display: flex; align-items: center; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid var(--border); font-size: 14px; text-align: left;
  }
  .pay-row span { color: var(--muted); width: 64px; flex-shrink: 0; font-size: 12.5px; }
  .pay-row b { flex: 1; word-break: break-all; font-size: 13px; }
  .mini {
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px; flex-shrink: 0;
  }
  .status { padding: 6px 0 14px; text-align: center; }
  .status-icon { font-size: 44px; margin-bottom: 8px; }
  .status .muted { margin-top: 6px; font-size: 13.5px; }
  .status code { background: var(--panel2); padding: 1px 6px; border-radius: 6px; }
  .status.paid b { color: var(--ok); }
  .status.done b { color: var(--ok); }
  .status.failed b { color: var(--danger); }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #2a3560; border: 1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity: 0;
    transition: all .25s; pointer-events: none; max-width: 90%; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

async function copyText(text) {

  if (btn) copyText(btn.getAttribute("data-copy"));
});

function sparkline(points) {
  const sorted = [...points].sort((a, b) => b.days_ago - a.days_ago);
  const vals = sorted.map((p) => parseFloat(p.price_ton));
  if (!vals.length) return "";
  const min = Math.min(...vals), max = Math.max(...vals);
  const W = 320, H = 84, pad = 8;
  const span = max - min || 1;
  const coords = sorted.map((p, i) => {
    const x = pad + (W - 2 * pad) * (i / (vals.length - 1 || 1));
    const y = H - pad - (H - 2 * pad) * ((vals[i] - min) / span);
    return [x, y];
  });
  const line = coords.map((c) => c.map((n) => n.toFixed(1)).join(",")).join(" ");
  const area = pad + "," + (H - pad) + " " + line + " " + (W - pad) + "," + (H - pad);
  const last = coords[coords.length - 1];
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" preserveAspectRatio="none">' +
    '<polyline points="' + area + '" fill="rgba(0,152,234,.14)" stroke="none"></polyline>' +
    '<polyline points="' + line + '" fill="none" stroke="#0098ea" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.5" fill="#526eff"></circle>' +
    "</svg>";
}

    '<div class="conf-bar"><div style="width:' + confPct + '%"></div></div>' +
    v.explanation.map((e) => '<div class="explain">• ' + esc(e) + "</div>").join("") +
    '<div class="traits">' +
    it.traits.map((t) =>
      '<div class="trait"><span>' + esc(t.name) + "</span><b>" + esc(t.value) + "</b><em>" + esc(t.rarity) + "</em></div>"
    ).join("") +
    "</div>" +
    (it.risk_flags.length
      ? '<div class="risk">' + it.risk_flags.map((f) => "<div>" + esc(f) + "</div>").join("") + "</div>"
      : "") +
    '<div class="card hist"><div class="card-title">Floor за 7 дней, TON</div>' + sparkline(it.price_history) + "</div>" +
    '<div class="card"><div class="card-title">Продавец</div>' +
    '<div class="addr">' + esc(it.seller_address) + "</div>" +
    '<div class="muted small" style="margin-top:6px">Кошелёк создан: ' + esc(it.seller_wallet_age) + "</div>" +
    "</div>" +
    '<button class="cta" id="btn-pay">💸 Оплатить напрямую в TON Keeper</button>' +
    '<div class="p2p-note">P2P-сделка без эскроу: вы переводите TON напрямую продавцу. Бот лишь верифицирует пересылку и фиксирует сделку. Решение всегда за вами.</div>';
  $("#btn-pay").onclick = showPayment;
}

// ── экран: оплата / статус сделки ───────────────────────────────────────
function showPayment() {
  if (state.deal && ["paid", "completed"].includes(state.deal.status)) { renderDeal(); return; }
  renderPaymentForm();
}

function renderPaymentForm() {
  const it = state.item;
  screenEl.innerHTML =
    '<div class="card">' +
    '<div class="card-title">Ваш кошелёк (TON Keeper, self-custody)</div>' +
    '<input id="inp-buyer" class="addr-input" placeholder="UQ… / EQ… / 0:…" value="' + esc(state.buyer) + '" autocomplete="off" spellcheck="false">' +
    '<div class="muted small">С этого адреса отправится пересылка <b style="color:var(--text)">' + esc(it.price_ton) +
    " TON</b> на кошелёк продавца. Адрес нужен, чтобы бот связал сделку с вами и позже проверил получение NFT.</div>" +
    '<button class="cta" id="btn-create">Создать сделку</button>' +
    '<button class="ghost" id="btn-back-nft">← Назад к NFT</button>' +
    (state.demo ? '<div class="demo-note">ДЕМО-РЕЖИМ: оплата будет симулирована, на blockchain ничего не уйдёт.</div>' : "") +
    "</div>" +
    '<div class="p2p-note">P2P-сделка без эскроу: деньги идут напрямую продавцу, без защиты маркетплейса. Проверьте возраст кошелька продавца и редкость предмета.</div>';
  $("#btn-back-nft").onclick = renderNft;
  $("#btn-create").onclick = createDeal;
}

async function createDeal() {
  const buyer = $("#inp-buyer").value.trim();
  if (!buyer) { toast("Введите адрес вашего кошелька"); return; }
  state.buyer = buyer;
  localStorage.setItem("ns_buyer", buyer);
  try {
    if (state.demo) {
      await sleep(500);
      state.deal = {
        deal_id: DEMO_DEAL_ID, status: "awaiting_payment", expires_in_sec: 1800,
        payment: DEMO_PAYMENT,
      };
      state.demoCheckCount = 0;
    } else {
      state.deal = await api.post("/api/webapp/otc/create", {
        item_id: state.item.id,
        buyer_address: buyer,
      });
    }
    renderDeal();
  } catch (e) {
    toast("Ошибка: " + e.message);
  }
}

function renderDeal() {
  const d = state.deal;
  const p = d.payment;
  let statusBlock = "";
  if (d.status === "awaiting_payment") {
    statusBlock =
      '<div class="status awaiting"><div class="status-icon">⏳</div>' +
      "<b>Ждём пересылку…</b>" +
      '<div class="muted">Отправьте ' + esc(p.amount_ton) + " TON на адрес продавца из TON Keeper.<br>Коммент обязателен: <code>" + esc(p.comment) + "</code></div></div>" +
      '<button class="cta" id="btn-check">Я оплатил — проверить</button>' +
      '<button class="ghost" id="btn-cancel">Отменить сделку</button>';
  } else if (d.status === "paid") {
    statusBlock =
      '<div class="status paid"><div class="status-icon">✅</div>' +
      "<b>Пересылка зафиксирована</b>" +
      '<div class="muted">' + esc(p.amount_ton) + " TON · адрес " + esc(p.seller_address_short) +
      (d.paid_tonscan_url ? '<br><a href="' + esc(d.paid_tonscan_url) + '" target="_blank" rel="noopener" style="color:var(--accent2)">смотреть транзакцию</a>' : "") +
      "</div></div>" +
      '<div class="muted small" style="margin-bottom:10px">Продавец, увидев перевод, должен перевести NFT на ваш адрес ' + esc(state.buyer.slice(0, 10)) + "…</div>" +
      '<button class="cta" id="btn-confirmed">Я получил NFT — закрыть сделку</button>';
  } else if (d.status === "completed") {
    statusBlock =
      '<div class="status done"><div class="status-icon">🎉</div>' +
      "<b>Сделка завершена</b>" +
      '<div class="muted">' + esc(state.item.name) + " теперь ваш. Сделка " + esc(d.deal_id) + " записана в вашу историю.</div></div>" +
      '<button class="ghost" id="btn-close-done">Готово</button>';
  } else if (d.status === "expired") {
    statusBlock =
      '<div class="status failed"><div class="status-icon">⌛</div><b>Срок оплаты истёк</b>' +
      '<div class="muted">Сделка ' + esc(d.deal_id) + " закрыта. Список мог измениться — проверьте цену.</div></div>" +
      '<button class="cta" id="btn-retry">Создать новую сделку</button>';
  } else if (d.status === "cancelled") {
    statusBlock =
      '<div class="status failed"><div class="status-icon">🚫</div><b>Сделка отменена</b></div>' +
      '<button class="cta" id="btn-retry">Попробовать снова</button>';
  }

  const qrBlock = d.status === "awaiting_payment"
    ? '<div class="card qr-card">' +
      '<div class="card-title">Оплата · ' + esc(p.amount_ton) + " TON</div>" +
      '<div class="qr-wrap"><img src="' + p.qr_data_uri + '" alt="TON QR">' +
      (state.demo ? '<div class="qr-watermark">ДЕМО</div>' : "") +
      "</div>" +
      '<div class="pay-row"><span>Кому</span><b class="mono">' + esc(p.seller_address) + '</b><button class="mini" data-copy="' + esc(p.seller_address) + '">⧉</button></div>' +
      '<div class="pay-row"><span>Сумма</span><b>' + esc(p.amount_ton) + " TON</b></div>" +
      '<div class="pay-row"><span>Коммент</span><b class="mono">' + esc(p.comment) + '</b><button class="mini" data-copy="' + esc(p.comment) + '">⧉</button></div>' +
      '<a class="cta" href="' + esc(p.universal_link) + '" target="_blank" rel="noopener">Открыть TON Keeper</a>' +
      '<a class="ghost" href="' + esc(p.tonkeeper_url) + '">deep-link tonkeeper://</a>' +
      '<div class="muted small">Сканируйте только этот QR: адрес, сумма и коммент уже подставлены. При оплате появится транзакция в вашем кошельке.</div>' +
      "</div>"
    : "";

  screenEl.innerHTML =
    '<div class="deal">' + statusBlock + qrBlock +
    '<div class="p2p-note">P2P-сделка без эскроу: бот не держит средства. Если продавец не перевёл NFT после оплаты — обратитесь в поддержку бота с хэшем транзакции.</div>' +
    "</div>";

  const check = () => { clearInterval(state.pollTimer); state.pollTimer = setInterval(checkPayment, 2500); };
  const btnCheck = $("#btn-check");
  if (btnCheck) {
    btnCheck.onclick = () => { checkPayment(); };
    check();
  }
  const btnCancel = $("#btn-cancel");
  if (btnCancel) {
    btnCancel.onclick = async () => {
      try {
        if (!state.demo) { Object.assign(state.deal, await api.post("/api/webapp/otc/" + d.deal_id + "/cancel")); }
        state.deal.status = "cancelled";
        renderDeal();
      } catch (e) { toast("Ошибка: " + e.message); }
    };
  }
  const btnConfirmed = $("#btn-confirmed");
  if (btnConfirmed) {
    btnConfirmed.onclick = async () => {
      try {
        clearInterval(state.pollTimer);
        if (!state.demo) { Object.assign(state.deal, await api.post("/api/webapp/otc/" + d.deal_id + "/confirm-nft", {})); }
        state.deal.status = "completed";
        renderDeal();
      } catch (e) { toast("Ошибка: " + e.message); }
    };
  }
  const btnRetry = $("#btn-retry");
  if (btnRetry) { btnRetry.onclick = () => { state.deal = null; renderPaymentForm(); }; }
  const btnCloseDone = $("#btn-close-done");
  if (btnCloseDone) { btnCloseDone.onclick = closeApp; }
}

async function checkPayment() {
  const d = state.deal;
  if (!d) return;
  try {
    let st;
    if (state.demo) {
      await sleep(600);
      state.demoCheckCount += 1;
      if (state.demoCheckCount >= 2) {
        st = {
          deal_id: d.deal_id, status: "paid", amount_ton: d.payment.amount_ton,
          seller_address: d.payment.seller_address,
          paid_tx_hash: "demo_tx_a1b2c3d4e5f6a7b8c9d0", paid_tonscan_url: null,
        };
      } else {
        st = {
          deal_id: d.deal_id, status: "awaiting_payment",
          amount_ton: d.payment.amount_ton, seller_address: d.payment.seller_address,
        };
      }
    } else {
      st = await api.post("/api/webapp/otc/" + d.deal_id + "/check-payment");
    }
    Object.assign(d, st);
    renderDeal();
  } catch (e) {
    clearInterval(state.pollTimer);
    toast("Ошибка: " + e.message);
  }
}

// ── роутинг ─────────────────────────────────────────────────────────────
function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/nft\/(.+)$/);
  if (m) loadItem(decodeURIComponent(m[1]));
  else renderList();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
