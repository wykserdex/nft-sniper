[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

# DSN берётся из env (NFT_POSTGRES_DSN) в migrations/env.py.
# Значение ниже — fallback для локальной разработки.
sqlalchemy.url = postgresql+asyncpg://nft_sniper:nft_sniper@localhost:5432/nft_sniper

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
