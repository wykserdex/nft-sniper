name: nft-sniper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nft_sniper
      POSTGRES_PASSWORD: nft_sniper
      POSTGRES_DB: nft_sniper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nft_sniper -d nft_sniper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Приложение: поднять вместе с инфраструктурой через `docker compose --profile full up --build`
  app:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      NFT_APP_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
